<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8FC; --card:#fff; --wash:#F3EEF8; --line:#E3D9EE;
  --ink:#2A1838; --ink-2:#65567A; --ink-3:#94879F;
  --purple:#6B2B8C; --purple-deep:#45195F; --purple-soft:#EBDDF5;
  --gold:#F5A524; --gold-soft:#FDEFD3; --gold-ink:#8A5300;
  --teal:#1E8C86; --teal-soft:#DDF1EF;
  --blue:#2C6DB2; --blue-soft:#DCE9F7;
  --coral:#D64545; --coral-soft:#FBE4E4;
  --rc:var(--purple); --rs:var(--purple-soft);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh}
body.has-tabs{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.has-savebar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.h,.num{font-family:'Prompt','IBM Plex Sans Thai',sans-serif}
.muted{color:var(--ink-2)} .small{font-size:13px} .xs{font-size:12px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:18px}

/* line/role accents */
.line-AA{--rc:#C77F00;--rs:var(--gold-soft)}
.line-PT{--rc:var(--purple);--rs:var(--purple-soft)}
.line-OT{--rc:var(--teal);--rs:var(--teal-soft)}
.line-TMS{--rc:var(--blue);--rs:var(--blue-soft)}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--purple-deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 11px;display:flex;align-items:center;gap:11px}
.bar .logo{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0}
.bar h1{font:600 16px/1.25 'Prompt',sans-serif}
.bar .sub{font-size:12px;opacity:.78;line-height:1.3}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.14)}
.icon-btn svg{width:22px;height:22px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.page{max-width:560px;margin:0 auto;padding:16px 16px 24px}
.page.wide{max-width:1040px}
.title{font:600 20px/1.3 'Prompt',sans-serif}
.sec{font:600 15px/1.3 'Prompt',sans-serif;color:var(--purple-deep);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--wash)}
.note{background:var(--wash);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.note.warn{background:var(--gold-soft);color:var(--gold-ink)}
.note.bad{background:var(--coral-soft);color:#8f2a2a}

/* buttons / inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--purple);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;min-height:48px}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.alt{background:var(--purple-soft);color:var(--purple-deep)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#3a2500}
.btn.danger{background:var(--coral-soft);color:#8f2a2a}
.btn.sm{width:auto;min-height:38px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
label.f{display:block;font-weight:600;font-size:14px;margin:16px 0 7px}
label.f:first-child{margin-top:0}
label.f small{font-weight:400;color:var(--ink-2)}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;min-height:46px}
.in:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;min-height:40px;line-height:1.3}
.chip.on{background:var(--rc);border-color:var(--rc);color:#fff}
.chip.sm{min-height:34px;padding:5px 12px;font-size:13px}
.line-AA .chip.on{color:#fff}
.seg{display:flex;background:var(--wash);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--purple-deep);font-weight:600;box-shadow:0 1px 3px rgba(69,25,95,.16)}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--rs);color:var(--rc);white-space:nowrap;line-height:1.6}
.badge.grey{background:var(--wash);color:var(--ink-2)}
.badge.bad{background:var(--coral-soft);color:#9b2c2c}
.badge.warn{background:var(--gold-soft);color:var(--gold-ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-3);font-weight:500}
.tabs button.on{color:var(--purple);font-weight:600}
.tabs svg{width:23px;height:23px}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:35;background:var(--gold);color:#3a2500;border-radius:999px;padding:13px 20px 13px 16px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(69,25,95,.28)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.savebar .in-bar{max-width:560px;margin:0 auto}

/* patient list */
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .in{padding-left:42px}
.pcard{display:flex;gap:12px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--rs);color:var(--rc);display:grid;place-items:center;font:600 17px 'Prompt',sans-serif;flex-shrink:0}
.pcard .nm{font-weight:600;line-height:1.35}
.pk{margin-top:9px}
.pk-name{font-size:13px;color:var(--ink-2);margin-bottom:5px;line-height:1.35}
.meter{display:flex;align-items:center;gap:10px}
.meter-bar{flex:1;height:8px;background:var(--wash);border-radius:99px;overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--rc);border-radius:99px}
.meter span{font-size:13px;white-space:nowrap;color:var(--ink-2)}
.meter b{font:700 15px 'Prompt',sans-serif;color:var(--ink)}
.meter.low .meter-bar i{background:var(--gold)} .meter.low b{color:var(--gold-ink)}
.meter.zero .meter-bar i{background:var(--coral)} .meter.zero b{color:var(--coral)}

/* punch card */
.left-big{display:flex;align-items:baseline;gap:8px}
.left-big .lb-n{font:700 58px/1 'Prompt',sans-serif;color:var(--rc)}
.left-big .lb-u{font-size:16px;color:var(--ink-2)}
.left-big.low .lb-n{color:#B36F00} .left-big.zero .lb-n{color:var(--coral)}
.punch{display:grid;gap:8px;margin-top:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #CDBFDB;color:var(--ink-3);font:600 15px/1.05 'Prompt',sans-serif}
.stamp small{font:500 9.5px/1.1 'IBM Plex Sans Thai',sans-serif;margin-top:2px;letter-spacing:0}
.stamp.used{background:var(--rc);border:2px solid var(--rc);color:#fff}
.stamp.now{background:var(--gold);border:2px solid var(--gold);color:#3a2500;box-shadow:0 0 0 4px var(--gold-soft)}

/* forms */
.grp{margin-top:20px}
.grp>.gl{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.grp>.gl small{font-weight:400;color:var(--ink-2)}
details.more{margin-top:20px;border:1.5px solid var(--line);border-radius:16px;padding:0 14px;background:#fff}
details.more summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'+';font:600 20px 'Prompt';color:var(--purple)}
details.more[open] summary::after{content:'–'}
details.more .inner{padding:2px 0 16px}
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.pain button{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;min-width:0}
.pain button.on{background:var(--rc);border-color:var(--rc);color:#fff}

/* price summary */
.sum{background:var(--wash);border-radius:16px;padding:14px 16px}
.sum .r{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sum .tot{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:700}
.sum .tot .num{font-size:22px;color:var(--purple-deep)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;margin-bottom:8px}
.opt.on{border-color:var(--rc);background:var(--rs)}
.opt .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opt .pr{font:600 17px 'Prompt',sans-serif;color:var(--purple-deep)}

/* lists */
.day{font:600 13px 'Prompt',sans-serif;color:#fff;background:var(--purple-deep);padding:6px 12px;border-radius:10px;margin:16px 0 8px;display:flex;justify-content:space-between}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.item:last-child{border-bottom:0}
.item .tm{font:600 14px 'Prompt',sans-serif;color:var(--rc);width:46px;flex-shrink:0;padding-top:1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:8px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi .n{font:700 30px/1.1 'Prompt',sans-serif;color:var(--purple-deep)}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:4px}
.bars .br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bars .br .lbl{width:92px;flex-shrink:0}
.bars .br .tr{flex:1;height:10px;background:var(--wash);border-radius:99px;overflow:hidden}
.bars .br .tr i{display:block;height:100%;background:var(--purple);border-radius:99px}
.bars .br .v{width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:28px 22px}
.login .logo{width:84px;height:84px;border-radius:50%;background:#fff;padding:4px;border:1px solid var(--line);margin-bottom:22px}
.login h1{font:700 28px/1.25 'Prompt',sans-serif;color:var(--purple-deep)}
.login p{color:var(--ink-2);margin:8px 0 26px}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:14px;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--purple)}

/* overlays */
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:120;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;max-width:440px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast div.err{background:#8f2a2a}
#busy{position:fixed;inset:0;background:rgba(250,248,252,.7);z-index:110;display:grid;place-items:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--purple-soft);border-top-color:var(--purple);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
#sheet{position:fixed;inset:0;z-index:100;background:rgba(42,24,56,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .pane{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
#sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:6px auto 14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{word-break:break-word}

/* client report */
.report{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;width:100%;max-width:440px;margin:0 auto;color:var(--ink)}
.rp-head{background:var(--purple-deep);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.rp-head img{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px}
.rp-head .t{font:700 17px/1.25 'Prompt',sans-serif}
.rp-head .s{font-size:12.5px;opacity:.82}
.rp-body{padding:18px}
.rp-who{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rp-who .nm{font:700 20px/1.3 'Prompt',sans-serif}
.rp-meta{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.6}
.rp-hr{height:0;border-top:1.5px dashed var(--line);margin:16px 0}
.rp-sub{font:600 14px 'Prompt',sans-serif;color:var(--purple-deep);margin-bottom:8px}
.rp-line{font-size:14px;margin-top:8px;line-height:1.6}
.rp-line b{font-weight:600}
.rp-foot{background:var(--wash);padding:13px 18px;font-size:13px;color:var(--ink-2);text-align:center;line-height:1.6}
.rp-tags{display:flex;flex-wrap:wrap;gap:6px}
.rp-tag{background:var(--rs);color:var(--rc);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;line-height:1.5}
.rp-tbl{width:100%;border-collapse:collapse;font-size:13px}
.rp-tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rp-tbl td:first-child{width:28px;font:600 13px 'Prompt',sans-serif;color:var(--rc)}
.rp-tbl td.d{white-space:nowrap;width:78px;color:var(--ink-2)}

@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0!important}
  body *{visibility:hidden}
  #rep,#rep *{visibility:visible}
  #rep{position:absolute;left:0;top:0;width:100%}
  .report{border:0;max-width:none;border-radius:0}
  .rp-head,.stamp.used,.stamp.now,.rp-tag,.rp-foot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== หน้าแรก 3 โหมด ===== */
body.landing-bg{background:#E8EFEC}
.land{max-width:520px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 22px 40px}
.brandrow{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.brandrow img{width:70px;height:70px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 8px 22px rgba(50,70,64,.22);flex-shrink:0}
.brandrow h1{font:700 27px/1.2 'Prompt',sans-serif;color:#2B3D38}
.brandrow .s{color:#6F8580;font-size:17px;margin-top:2px}
.hero{background:linear-gradient(150deg,#6F5FD0 0%,#8E6FDC 55%,#B47ADB 100%);border-radius:36px;padding:34px 22px 30px;text-align:center;color:#fff;box-shadow:0 18px 40px rgba(111,95,208,.28)}
.hero .mark{width:96px;height:96px;border-radius:26px;background:#fff;display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 8px 22px rgba(30,20,80,.25)}
.hero .mark img{width:84px;height:84px;border-radius:20px;object-fit:contain}
.hero h2{font:700 27px/1.3 'Prompt',sans-serif;margin-bottom:10px}
.hero p{font-size:16px;line-height:1.6;opacity:.95;margin:0 auto 20px;max-width:380px}
.hero .pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hero .pill{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px}
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.entry{border-radius:30px;padding:20px 18px;color:#fff;text-align:left;min-height:136px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 12px 26px rgba(40,50,60,.18);transition:transform .12s;position:relative}
.entry:active{transform:scale(.97)}
.entry .ico{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:30px;margin-bottom:auto;align-self:flex-start}
.entry .t{font:700 22px/1.25 'Prompt',sans-serif;margin-top:16px}
.entry .d{font-size:14.5px;opacity:.94;line-height:1.4;margin-top:2px}
.entry.staff{background:linear-gradient(140deg,#7C6FE0,#A78BFA)}
.entry.admin{background:linear-gradient(140deg,#14B8A6,#3FB39A)}
.entry.checkin{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:auto;padding:18px;background:linear-gradient(120deg,#F0A94E,#F6C667)}
.entry.checkin .ico{margin:0;flex-shrink:0}
.entry.checkin .t{margin-top:0}
.who-strip{margin-top:20px;background:rgba(255,255,255,.7);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:14px;color:#41524D}
.who-strip b{color:#2B3D38}
.who-strip button{margin-left:auto;color:#2B3D38;font-weight:600;text-decoration:underline;padding:4px 2px}
.mode-pill{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#fff;border-radius:999px;padding:6px 14px 6px 10px;margin-bottom:16px;align-self:flex-start}
.mode-pill.staff{background:linear-gradient(140deg,#7C6FE0,#A78BFA)}
.mode-pill.admin{background:linear-gradient(140deg,#14B8A6,#3FB39A)}
.mode-pill.checkin{background:linear-gradient(120deg,#F0A94E,#E9B24E)}
.linkback{align-self:flex-start;color:var(--ink-2);font-weight:600;font-size:14px;margin-bottom:18px;padding:4px 0;display:inline-flex;align-items:center;gap:4px}

/* ===== เช็คอิน ===== */
.ci-photo{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:150px;border:2px dashed var(--line);border-radius:20px;background:#fff;color:var(--ink-2);font-weight:600;flex-direction:column}
.ci-photo.has{padding:0;border-style:solid;overflow:hidden;min-height:0}
.ci-photo img{display:block;width:100%;max-height:300px;object-fit:cover}
.ci-done{background:var(--teal-soft);border:1px solid #B9DDDA;color:#0F5F5A;border-radius:18px;padding:14px 16px}
.ci-item{display:flex;align-items:center;gap:12px}
.ci-item .when{font:600 15px/1.2 'Prompt',sans-serif;min-width:52px;color:var(--purple-deep)}
.linkbtn{color:var(--purple);font-weight:600;text-decoration:underline;padding:4px 2px;font-size:13px}
.photo-view{display:block;width:100%;border-radius:14px;margin-top:10px}

/* ===== v3: คิวรอส่ง · นัดวันนี้ · ทิป · สลิป · หน้าญาติ ===== */
.ob-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--gold-soft);color:var(--gold-ink);font-weight:600;font-size:13.5px;padding:10px 16px;text-align:left;border-bottom:1px solid #F0D9A6}
.ob-bar.bad{background:var(--coral-soft);color:#8f2a2a;border-color:#F1BDBD}
.ob-bar span{font-weight:500;text-decoration:underline;font-size:13px;white-space:nowrap}
.appt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.appt h3{font:600 15px/1.3 'Prompt',sans-serif;color:var(--purple-deep);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.appt h3 .cnt{background:var(--purple);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px}
.appt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--wash);cursor:pointer}
.appt-row:first-of-type{border-top:0}
.appt details{margin-top:6px} .appt summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);padding:6px 0}
.avatar.sm{width:34px;height:34px;font-size:14px}
.tip{background:#fff;border-radius:22px;padding:14px 16px;margin-top:16px;font-size:14px;color:#41524D;box-shadow:0 6px 16px rgba(40,50,60,.08)}
.tip.warn{background:#FFF4DD;color:#7A4B00}
.tip b{color:inherit}
.tip .row{margin-top:10px;gap:8px;flex-wrap:wrap}
.tip .btn{width:auto;min-height:0;padding:8px 14px;font-size:13.5px}
.slip{background:#fff;padding:18px;border:1px solid var(--line);border-radius:16px}
.slip h4{font:700 18px/1.3 'Prompt',sans-serif;color:var(--purple-deep)}
.slip table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.slip td,.slip th{padding:5px 4px;border-bottom:1px solid var(--wash);text-align:left;vertical-align:top}
.slip th{color:var(--ink-3);font-weight:500;font-size:12px}
.slip .r{text-align:right}
.slip .tot{display:flex;justify-content:space-between;font:600 15px 'Prompt',sans-serif;padding-top:10px}
tr[data-act="slip"]{cursor:pointer}
tr[data-act="slip"]:active{background:var(--wash)}
.lock{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--wash);border-radius:16px;padding:10px 14px;font-size:13.5px}
.lock.on{background:var(--teal-soft);color:#0F5F5A}
.lock .btn{width:auto;min-height:0;padding:8px 14px;font-size:13px}
.fam{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px}
.fam .fs{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.fam .fs .h1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fam .fs .h1 b{font:600 15px 'Prompt',sans-serif;color:var(--purple-deep)}
.linkbox{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;background:var(--wash);color:var(--ink-2);word-break:break-all}
.ci-done .btn{margin-top:8px;min-height:0;padding:9px 14px;font-size:14px}
.draftnote{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ===== รายงานญาติ: เนื้อหารายงานเด่น · จำนวนครั้งย่อเล็ก ===== */
.rp-focus{background:var(--rs);border-left:6px solid var(--rc);border-radius:16px;padding:16px 16px 18px;margin-top:14px}
.rp-focus .rp-sub{font:700 19px/1.3 'Prompt',sans-serif;color:var(--rc);margin-bottom:6px}
.rp-focus .rp-meta{font-size:14.5px;color:var(--ink);opacity:.8}
.rp-focus .rp-line{font-size:16px;margin-top:10px}
.rp-focus .rp-tags{gap:7px;margin-top:6px}
.rp-focus .rp-tag{background:var(--rc);color:#fff;font-size:14.5px;padding:4px 13px}
.rp-focus .rp-tbl{font-size:14px}
.rp-mini{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--wash)}
.rp-mini-t{display:flex;align-items:baseline;gap:8px}
.rp-mini .mn{font:700 22px/1 'Prompt',sans-serif;color:var(--ink-2)}
.rp-mini .ml{font-size:13px;color:var(--ink-2)}
.rp-mini.low .mn{color:#B36F00}.rp-mini.zero .mn{color:var(--coral)}
.rp-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rp-dots i{width:14px;height:14px;border-radius:50%;border:1.5px dashed #CDBFDB;display:block}
.rp-dots i.used{background:#B8AAC8;border:1.5px solid #B8AAC8}
.rp-dots i.now{background:var(--rc);border:1.5px solid var(--rc)}
@media print{.rp-focus,.rp-mini,.rp-dots i,.rp-focus .rp-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

const TIMEOUT_MS = 20000;
async function req(url, opt) {
  if (!GAS_API_URL || GAS_API_URL.indexOf('PASTE_') === 0) throw new Error('ยังไม่ได้ตั้งค่า GAS_API_URL ในไฟล์ index.html');
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(url, Object.assign({}, opt, { signal: c.signal }));
    const j = await r.json();
    if (j && j.success === false) { const e = new Error(j.message || 'ไม่สำเร็จ'); e.code = j.code; throw e; }
    return j;
  } catch (e) {
    if (e.name === 'AbortError') { const x = new Error('เซิร์ฟเวอร์ตอบช้า / สัญญาณไม่ดี ลองใหม่อีกครั้ง'); x.network = true; throw x; }
    if (e instanceof TypeError) { const x = new Error('ไม่มีสัญญาณอินเทอร์เน็ต'); x.network = true; throw x; }
    throw e;
  } finally { clearTimeout(t); }
}
function apiGet(action, params) {
  const qs = new URLSearchParams(Object.assign({ action, code: (S.me && S.me.code) || '' }, params || {}));
  return req(GAS_API_URL + '?' + qs.toString());
}
function apiPost(action, payload) {
  return req(GAS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // เลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
    body: JSON.stringify(Object.assign({ action, code: (S.me && S.me.code) || '' }, payload || {}))
  });
}

  const todo = obMine().filter(x => !x.err);

  obBusy = true; let ok = 0, bad = 0;
  try {

      catch (e) {

        obErr(it.id, e.message); bad++;

  if (ok) { try { await refreshCore(); } catch (e) { /* ข้าม */ } S.cache = {}; }

function chooseMode(mode) {

}

async function doLogin(code, remember, mode, opt) {
  const res = await apiGet('login', { code });
  if (mode === 'admin' && !res.isAdmin) throw new Error('รหัสนี้ไม่ใช่รหัสแอดมิน');
  S.me = { code, name: res.name, role: res.role, isAdmin: !!res.isAdmin };
  try { if (remember) localStorage.setItem('cmcc_code', code); } catch (e) { /* ไม่มี storage ก็ข้าม */ }
  await refreshCore();
  S.scope = S.me.isAdmin ? 'all' : 'mine';
  obFlush(true);
  if (opt && opt.stay) { goLanding(); return; }
  enterMode(mode || 'staff');
}
function doLogout() {
  if (!confirm('ออกจากระบบ?')) return;
  try { localStorage.removeItem('cmcc_code'); } catch (e) { /* ignore */ }
  location.reload();
}

/* ---------------- แท็บ: คนไข้ ---------------- */
// นัดวันนี้ / พรุ่งนี้ / เลยนัด — ดึงจากช่อง "นัดครั้งถัดไป" ของครั้งล่าสุดในแต่ละแพ็คเกจ
function apptGroups() {
  const t = todayStr(), tm = addDays(t, 1), old = addDays(t, -14), all = S.me.isAdmin;
  const ks = S.packages.filter(k => k.status === 'active' && k.nextAppt && pkgLeft(k) > 0 && (all || k.staffCode === S.me.code || (!k.staffCode && canUse(k))));
  const by = (a, b) => (patientById(a.patientId) || { name: '' }).name.localeCompare((patientById(b.patientId) || { name: '' }).name, 'th');
  return { today: ks.filter(k => k.nextAppt === t).sort(by), tomorrow: ks.filter(k => k.nextAppt === tm).sort(by), overdue: ks.filter(k => k.nextAppt < t && k.nextAppt >= old).sort(by) };
}
function apptStripHTML() {
  const g = apptGroups();
  if (!g.today.length && !g.tomorrow.length && !g.overdue.length) return '';
  const row = (k, tag) => {
    const p = patientById(k.patientId); if (!p) return '';
    return `<div class="appt-row" data-act="patient" data-id="${p.id}"><div class="avatar sm">${esc(initial(p.name))}</div>
      <div class="grow"><div class="b small">${esc(p.name)}</div><div class="xs muted">${esc(k.name)} · เหลือ ${pkgLeft(k)} ครั้ง${tag ? ' · ' + esc(tag) : ''}</div></div>
      ${canUse(k) ? `<button class="btn sm" data-act="record" data-p="${p.id}" data-k="${k.id}" style="width:auto;min-height:0;padding:8px 14px">บันทึก</button>` : ''}</div>`;
  };
  const head = (t, n, on) => `<h3>${t}<span class="cnt">${n}</span></h3>`;
  return `<div class="appt">
    ${g.today.length ? head('📅 นัดวันนี้', g.today.length) + g.today.map(k => row(k)).join('') : `<h3>📅 วันนี้ไม่มีนัดที่ลงไว้</h3>`}
    ${g.tomorrow.length ? `<details><summary>พรุ่งนี้ (${g.tomorrow.length})</summary>${g.tomorrow.map(k => row(k)).join('')}</details>` : ''}
    ${g.overdue.length ? `<details><summary style="color:#9b2c2c">เลยนัดแล้ว (${g.overdue.length})</summary>${g.overdue.map(k => row(k, 'นัด ' + thShort(k.nextAppt))).join('')}</details>` : ''}
  </div>`;
}
function tabPatients() {
  const admin = S.me.isAdmin;
  const scopes = admin ? [['all', 'ทั้งหมด'], ['low', 'ใกล้หมด'], ['none', 'ไม่มีแพ็คเกจ']] : [['mine', 'ของฉัน'], ['all', 'ทั้งหมด'], ['low', 'ใกล้หมด']];
  return `<main class="page stack">
    ${apptStripHTML()}
    <div class="search">${ic('search')}<input class="in" id="pq" type="search" placeholder="ค้นหาชื่อคนไข้" value="${esc(S.q)}" autocomplete="off"></div>
    ${chipGroup('S', 'scope', scopes.map(s => ({ v: s[0], l: s[1] })), S.scope, { sm: true })}
    <div id="plist" class="stack">${patientListHTML()}</div>
  </main>`;
}
function patientRows() {
  const q = S.q.trim().toLowerCase();
  let rows = S.patients.filter(p => p.active).map(p => ({ p, pk: activePkgs(p.id) }));
  if (q) rows = rows.filter(r => (r.p.name + ' ' + r.p.condition).toLowerCase().includes(q));
  if (S.scope === 'mine') rows = rows.filter(r => r.pk.some(k => k.staffCode === S.me.code));
  if (S.scope === 'low') rows = rows.filter(r => r.pk.some(k => pkgLeft(k) <= 2 || (expiryInfo(k) || {}).near));
  if (S.scope === 'none') rows = rows.filter(r => !r.pk.length);
  rows.sort((a, b) => a.p.name.localeCompare(b.p.name, 'th'));
  return rows;
}
function patientListHTML() {
  const rows = patientRows();
  if (!rows.length) {
    const msg = S.q ? 'ไม่พบชื่อที่ค้นหา' : S.scope === 'mine' ? 'ยังไม่มีคนไข้ที่ได้รับมอบหมายให้คุณ — กด "ทั้งหมด" เพื่อดูคนไข้ทุกคน' : S.me.isAdmin ? 'ยังไม่มีข้อมูล — กด "คนไข้ใหม่" เพื่อเริ่มลงทะเบียน' : 'ไม่มีรายการ';
    return `<div class="note">${msg}</div>`;
  }
  return rows.map(({ p, pk }) => {
    const line = pk.length ? lineOf(pk[0]) : 'PT';
    const lines = pk.slice(0, 2).map(k => { const e = expiryInfo(k); return `<div class="pk line-${lineOf(k)}"><div class="pk-name">${esc(k.name)}</div>${meter(k)}${e && e.days <= 30 ? `<div style="margin-top:4px"><span class="badge ${e.tone}">${esc(e.label)}</span></div>` : ''}</div>`; }).join('') +
      (pk.length > 2 ? `<div class="xs muted" style="margin-top:6px">และอีก ${pk.length - 2} แพ็คเกจ</div>` : '') ||
      '<div class="small muted" style="margin-top:6px">ไม่มีแพ็คเกจที่ใช้งานอยู่</div>';
    const quick = pk.length === 1 && canUse(pk[0]) && pkgLeft(pk[0]) > 0
      ? `<button class="btn sm" data-act="record" data-p="${p.id}" data-k="${pk[0].id}" style="margin-top:12px">บันทึกครั้งนี้</button>` : '';
    return `<div class="card tap line-${line}" data-act="patient" data-id="${p.id}">
      <div class="pcard"><div class="avatar">${esc(initial(p.name))}</div>
        <div class="grow">
          <div class="row between" style="align-items:flex-start"><div class="nm">${esc(p.name)}</div><span class="badge grey">${PTYPE[p.type] || p.type}</span></div>
          ${lines}${quick}
        </div></div></div>`;
  }).join('');
}

      <div style="margin-top:12px">${leftBig(k)}</div>
      <div id="punch-${k.id}">${punchHTML(k, [])}</div>
      <div class="btn-row" style="margin-top:14px">
        ${canUse(k) && pkgLeft(k) > 0 ? `<button class="btn" data-act="record" data-p="${p.id}" data-k="${k.id}">บันทึกครั้งนี้</button>` : ''}
        <button class="btn alt" data-act="report" data-k="${k.id}">รายงานให้ญาติ</button>
      </div>
      ${(expiryInfo(k) || {}).days < 0 ? '<div class="note bad" style="margin-top:12px">แพ็คเกจหมดอายุแล้ว — ทีมงานบันทึกครั้งเพิ่มไม่ได้ แจ้งแอดมินเพื่อขยายวันหรือต่อแพ็คเกจ</div>' : ''}

      ${admin ? `<div class="btn-row" style="margin-top:10px"><button class="btn line sm" data-act="edit-pkg" data-k="${k.id}">แก้ไขแพ็คเกจ</button></div>` : ''}
    </div>`).join('');
  return topbar({ back: true, title: p.name, sub: PTYPE[p.type] + (p.family ? ' · ' + p.family : ''),
    right: admin ? `<button class="icon-btn" data-act="edit-patient" data-id="${p.id}" aria-label="แก้ไขข้อมูล">${ic('edit')}</button>` : '' }) +

    ${admin ? `<button class="btn gold" data-act="sell" data-p="${p.id}">${ic('plus')}ขายแพ็คเกจ / รายครั้ง</button>` : ''}
    <div class="sec">ประวัติการรักษา</div>

mounts.patient = async ({ id }) => {

};

function sessionItems(list, showPatient) {
  return list.map(s => `<div class="item line-${lineOfSession(s)}" data-act="session" data-id="${s.id}">
      <div class="tm">${showPatient ? esc(s.time) : esc(thShort(s.date))}</div>

        <div class="xs muted">${showPatient ? esc(s.pkgName) + ' · ' : ''}ครั้งที่ ${s.no}/${s.pkgTotal} · ${esc(s.staffName)} (${esc(s.staffRole)}) · ${esc(PLACE[s.location] ? PLACE[s.location].label : '')}</div>
        <div class="xs" style="margin-top:2px">${esc(split(s.focus).slice(0, 3).join(' · '))}</div></div></div>`).join('');
}
function lineOfSession(s) { const k = pkgById(s.pkgId); return k ? lineOf(k) : (s.staffRole === 'PTA' ? 'AA' : s.staffRole === 'OT' ? 'OT' : 'PT'); }

/* ---------------- แท็บ: ประวัติ / รายการ ---------------- */
function tabSessions() {

  return `<main class="page ${admin ? 'wide' : ''} stack">
    <div class="${admin ? 'two' : ''}"><div><label class="f" for="smonth">เดือน</label><input class="in" type="month" id="smonth" value="${S.month}"></div>

    <div class="search">${ic('search')}<input class="in" id="sq" type="search" placeholder="ค้นหาชื่อคนไข้" value="${esc(S.sq)}" autocomplete="off"></div>
    ${admin ? `<button class="btn gold" data-act="excel">${ic('download')}ดาวน์โหลด Excel เดือนนี้</button>` : ''}
    <div id="slist"><div class="note">กำลังโหลด…</div></div>
  </main>`;

async function loadMonthSessions() {
  const [from, to] = monthRange(S.month);
  const p = { from, to };
  if (!S.me.isAdmin) p.staffCode = S.me.code;
  else if (S.staffFilter) p.staffCode = S.staffFilter;
  return getSessions(p);
}
async function paintSessions() {
  const box = $('#slist'); if (!box) return;
  try {
    let ss = await loadMonthSessions();
    if (S.tab !== 'sessions' || !$('#slist')) return;
    const q = S.sq.trim().toLowerCase();
    if (q) ss = ss.filter(s => s.patientName.toLowerCase().includes(q));
    const cases = new Set(ss.map(s => s.patientId)).size;
    if (!ss.length) { box.innerHTML = '<div class="note">ยังไม่มีรายการในเดือนนี้</div>'; return; }
    const days = {};

function lineMessage(k, p, ss, sid, mode) {
  const sel = ss.find(x => x.id === sid) || ss[ss.length - 1];
  const one = mode === 'one' && sel;
  const used = one ? sel.no : ss.length, left = Math.max(0, k.total - used);
  const L = ['📋 รายงานการบำบัด · ' + p.name, 'แพ็คเกจ: ' + k.name];
  if (one) {
    L.push('ครั้งที่ ' + sel.no + '/' + k.total + ' · ' + thDate(sel.date, true) + ' ' + sel.time + ' น.');
    L.push('โปรแกรมที่ฝึก: ' + split(sel.focus).join(', '));
    L.push('การตอบสนอง: ' + sel.response + ' · ความหนัก: ' + sel.intensity);
    if (sel.progress) L.push('ความก้าวหน้า: ' + sel.progress);
    if (split(sel.symptoms).length) L.push('อาการที่พบ: ' + split(sel.symptoms).join(', '));
    if (split(sel.homework).length) L.push('แนะนำให้ทำต่อที่บ้าน: ' + split(sel.homework).join(', '));
    if (sel.note) L.push('หมายเหตุ: ' + sel.note);
  } else {
    ss.forEach(x => L.push(x.no + ') ' + thShort(x.date) + ' — ' + split(x.focus).slice(0, 3).join(', ')));
  }
  L.push('────────', 'ใช้แล้ว ' + used + '/' + k.total + ' ครั้ง · เหลืออีก ' + left + ' ครั้ง');
  const ap = one ? sel.nextAppt : ([...ss].reverse().find(x => x.nextAppt) || {}).nextAppt;
  if (ap) L.push('นัดครั้งถัดไป: ' + thDate(ap, true));
  if (k.expiryDate) L.push('แพ็คเกจใช้ได้ถึง: ' + thDate(k.expiryDate));
  L.push('สอบถามเพิ่มเติม ' + CLINIC_PHONES, 'CMCC Home Care by CMNH');
  return L.join('\n');
}

function monthData(ss) {
  const by = {};
  ss.forEach(s => {
    const b = by[s.staffCode] = by[s.staffCode] || { code: s.staffCode, name: s.staffName, role: s.staffRole, sessions: 0, cases: new Set(), min: 0, value: 0 };
    b.sessions++; b.cases.add(s.patientId); b.min += Number(s.durationMin) || 0; b.value += Number(s.value) || 0;
  });
  return Object.values(by).map(b => {
    const st = staffByCode(b.code);
    const rate = st && st.payPerSession !== '' && st.payPerSession != null ? Number(st.payPerSession) : null;
    return Object.assign(b, { cases: b.cases.size, rate, pay: rate == null ? null : rate * b.sessions });
  }).sort((a, b) => b.sessions - a.sessions);
}

    <div id="dbody"><div class="note">กำลังโหลด…</div></div></main>`;
}

function homeWithoutCheckin(ss, cis) {
  const have = new Set(cis.map(c => c.staffCode + '|' + c.patientId + '|' + c.date));

async function slipBlob() {

}
async function slipShare(saveOnly) {

}

const priceFor = (x, ptype) => (ptype === 'IPD' && x.priceIPD) ? x.priceIPD : x.price;
function pkgTitle(x) {
  const L = LINES[x.line];
  if (x.line === 'TMS') return x.name + (x.n > 1 ? ' · ' + x.n + ' ครั้ง' : '');
  if (x.line === 'AA' && x.n > 1) return 'Active Aging · ' + x.name + ' (' + x.n + ' ครั้ง)';
  return L.label + ' · ' + x.name;
}
function initSell(p) {
  SF = { patientId: p.id, expiryM: '', line: 'PT', packKey: '', place: p.defaultLocation || 'CMNH', zone: p.zone || 'A', staffCode: '', start: todayStr(), override: false, price: '', note: '' };
}
function sellCalc() {
  const p = patientById(SF.patientId), x = packByKey(SF.packKey);
  if (!x) return null;
  const perZone = (LINES[SF.line].zone && SF.place === 'HOME') ? ZONE_ADD[SF.zone] : 0;
  const base = priceFor(x, p.type), add = perZone * x.n;
  const total = SF.override && SF.price !== '' ? Math.max(0, Math.round(Number(SF.price) || 0)) : base + add;
  return { x, base, perZone, add, total };
}
views.sell = ({ patientId }) => {

function paintSell() {
  const p = patientById(SF.patientId), L = LINES[SF.line];
  if (!L.places.includes(SF.place)) SF.place = L.places[0];
  const packs = PACKS.filter(x => x.line === SF.line);

  $('#sell-line').innerHTML = chipGroup('SF', 'line', Object.keys(LINES).map(k => ({ v: k, l: LINES[k].label })), SF.line, { req: 1 });
  $('#sell-sub').textContent = L.sub;
  $('#sell-packs').innerHTML = packs.map(x => { const pr = priceFor(x, p.type); return `<button type="button" class="opt line-${x.line} ${SF.packKey === x.key ? 'on' : ''}" data-act="pick-pack" data-v="${x.key}"><div class="top"><span class="b">${esc(x.name)}</span><span class="pr">${baht(pr)}</span></div><div class="xs muted">${x.n} ครั้ง${x.n > 1 ? ' · เฉลี่ย ' + baht(pr / x.n) + '/ครั้ง' : ''}${x.priceIPD && p.type === 'IPD' ? ' · ราคา IPD' : ''}</div></button>`; }).join('');
  $('#sell-place').innerHTML = chipGroup('SF', 'place', L.places.map(x => ({ v: x, l: PLACE[x].label })), SF.place, { req: 1 });

  $('#sell-zone').innerHTML = chipGroup('SF', 'zone', ['A', 'B', 'C'].map(z => ({ v: z, l: ZONE_TEXT[z] })), SF.zone, { req: 1 });
  $('#sell-exp').innerHTML = chipGroup('SF', 'expiryM', [{ v: '', l: 'ไม่กำหนด' }, { v: '3', l: '3 เดือน' }, { v: '6', l: '6 เดือน' }, { v: '12', l: '12 เดือน' }], SF.expiryM, { req: 1 }) +
    (SF.expiryM ? `<div class="xs muted" style="margin-top:6px">หมดอายุ ${esc(thDate(addMonthsStr(SF.start, Number(SF.expiryM))))}</div>` : '');
  const roles = L.roles;
  const opts = S.staff.filter(s => s.active && s.role !== 'ADMIN' && (roles.includes('ANY') || roles.includes(s.role)));
  if (!opts.find(s => s.code === SF.staffCode)) SF.staffCode = opts.length === 1 ? opts[0].code : '';   // มีคนเดียว = เลือกให้เลย

  const c = sellCalc();
  $('#sell-sum').innerHTML = c ? `
    <div class="r"><span>ราคาแพ็คเกจ${p.type === 'IPD' && c.x.priceIPD ? ' (IPD)' : ''}</span><span>${baht(c.base)}</span></div>
    ${c.perZone ? `<div class="r"><span>ค่าเดินทาง Zone ${SF.zone} (${baht(c.perZone)} × ${c.x.n} ครั้ง)</span><span>${baht(c.add)}</span></div>` : ''}
    ${SF.override ? `<div class="r"><span>ปรับราคาเอง</span><span>${SF.price === '' ? '—' : baht(c.total)}</span></div>` : ''}
    <div class="r tot"><span>ยอดรวม</span><span class="num">${baht(c.total)}</span></div>
    <div class="xs muted" style="margin-top:4px">เฉลี่ย ${baht(c.total / c.x.n)} ต่อครั้ง</div>` : '<div class="muted small">เลือกแพ็คเกจเพื่อดูราคา</div>';
}
async function saveSell() {
  const c = sellCalc();

    ${c.hasPhoto ? `<button class="linkbtn" data-act="view-photo" data-id="${esc(c.id)}">${ic('camera')}</button>` : ''}

}

// -- ฝั่งแอดมิน: แท็บรายการเช็คอิน --

// -- ฝั่งทีมงาน: ฟอร์มเช็คอิน --
function initCheckin() { CF = { init: 1, patientId: '', location: '', photo: '', done: CF.done || null }; }
views.checkin = () => {
  if (!CF.init) initCheckin();
  const mineIds = new Set(S.packages.filter(k => k.status === 'active' && (k.staffCode === S.me.code)).map(k => k.patientId));
  const pats = S.patients.filter(p => p.active).sort((a, b) => a.name.localeCompare(b.name, 'th'));
  const opt = p => `<option value="${esc(p.id)}" ${CF.patientId === p.id ? 'selected' : ''}>${esc(p.name)} · ${esc(PTYPE[p.type] || p.type)}</option>`;
  const mine = pats.filter(p => mineIds.has(p.id)), others = pats.filter(p => !mineIds.has(p.id));
  const needPhoto = CF.location === 'HOME';
  const d = CF.done;
  return topbar({ back: true, title: 'เช็คอินเข้างาน', sub: S.me.name + ' · ' + (S.me.isAdmin ? 'แอดมิน' : ROLE[S.me.role].label) }) + obBarHTML() + `<main class="page stack-lg">
    ${d ? `<div class="ci-done"><div class="b">${d.queued ? 'เก็บเช็คอินไว้ในเครื่องแล้ว (ยังไม่มีสัญญาณ)' : 'เช็คอินสำเร็จ'} · ${esc(d.time)} น.</div><div class="small">${esc(d.patientName)} · ${esc(ciPlaceLabel(d))}</div>
      ${S.packages.filter(k => k.status === 'active' && k.patientId === d.patientId && canUse(k) && pkgLeft(k) > 0).map(k => `<button class="btn" data-act="record" data-p="${esc(d.patientId)}" data-k="${k.id}" data-loc="${esc(d.location)}">บันทึกครั้งบำบัดเลย · ${esc(k.name)} (เหลือ ${pkgLeft(k)})</button>`).join('')}</div>` : ''}
    ${CF.restored && !d ? '<div class="note draftnote"><span>กู้คืนข้อมูลที่ยังไม่ได้ส่งแล้ว</span><button class="linkbtn" data-act="ci-reset">เริ่มใหม่</button></div>' : ''}
    <div>
      <div class="sec" style="margin-top:0">คนไข้ที่ไปให้บริการ</div>
      <select class="in" data-bind="CF.patientId" aria-label="คนไข้"><option value="">-- เลือกคนไข้ --</option>
        ${mine.length ? `<optgroup label="คนไข้ของฉัน">${mine.map(opt).join('')}</optgroup>` : ''}
        <optgroup label="${mine.length ? 'คนไข้ทั้งหมด' : 'รายชื่อคนไข้'}">${others.map(opt).join('')}</optgroup>
      </select>
    </div>
    <div><div class="sec" style="margin-top:0">สถานที่</div>${chipGroup('CF', 'location', ['HOME', 'CMNH', 'TQL'].map(x => ({ v: x, l: PLACE[x].label })), CF.location, { req: 1 })}</div>
    <div><div class="sec" style="margin-top:0">รูปหน้าบ้านคนไข้ <small class="muted" style="font-weight:400">${needPhoto ? 'จำเป็นสำหรับเยี่ยมบ้าน' : 'ไม่บังคับ'}</small></div>
      <input type="file" accept="image/*" capture="environment" id="ciPhoto" class="hidden">
      <button type="button" class="ci-photo ${CF.photo ? 'has' : ''}" data-act="ci-camera" id="ciBox">${CF.photo ? `<img src="${CF.photo}" alt="รูปที่ถ่าย">` : `${ic('camera')}<span>แตะเพื่อถ่ายรูป</span>`}</button>
      ${CF.photo ? '<button type="button" class="linkbtn" data-act="ci-camera" style="margin-top:6px">ถ่ายใหม่</button>' : ''}
    </div>
    <button class="btn" id="ciSave" data-act="save-checkin">${ic('pin')}เช็คอิน</button>
    <div><div class="sec">เช็คอินวันนี้ของฉัน</div><div id="ciToday" class="stack"><div class="muted small">กำลังโหลด…</div></div></div>
  </main>`;
};
mounts.checkin = async () => {
  try {
    const list = (await apiGet('checkIns', { date: todayStr(), mine: '1' })).checkins;
    const el = $('#ciToday'); if (el && cur.name === 'checkin') el.innerHTML = ciRows(list, false);
  } catch (e) { const el = $('#ciToday'); if (el) el.innerHTML = ''; }
};
// ย่อรูปก่อนส่ง (กว้างไม่เกิน 900px, JPEG 75%) กัน payload ใหญ่เกินไป
function handleCiPhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      CF.photo = cv.toDataURL('image/jpeg', 0.75);
      renderKeep(); scheduleDraft();
    };
    img.onerror = () => toast('เปิดรูปไม่ได้ ลองถ่ายใหม่', 'err');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
async function saveCheckin() {
  if (!CF.patientId) { toast('เลือกคนไข้ก่อน', 'err'); return; }
  if (!CF.location) { toast('เลือกสถานที่', 'err'); return; }
  if (CF.location === 'HOME' && !CF.photo) { toast('ถ่ายรูปหน้าบ้านคนไข้ก่อนเช็คอิน', 'err'); return; }
  if (!CF.clientId) CF.clientId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const p = patientById(CF.patientId), body = { patientId: CF.patientId, location: CF.location, photo: CF.photo, clientId: CF.clientId };
  const btn = $('#ciSave'); if (btn) btn.disabled = true;
  try {
    const r = await run(() => apiPost('checkIn', { checkin: body }), { quiet: true });
    clearDraft('ci');
    CF = { init: 1, patientId: '', location: '', photo: '', done: Object.assign({ patientName: p.name }, r.checkin) };
    S.cache = {}; render();
    toast('เช็คอินสำเร็จ เวลา ' + r.checkin.time + ' น.');
  } catch (e) {
    if (btn) btn.disabled = false;
    if (e.network) {
      // ไม่มีสัญญาณ: เก็บในเครื่อง พร้อมเวลาจากเครื่อง — ส่งอัตโนมัติเมื่อออนไลน์ (เซิร์ฟเวอร์ติดป้าย "ส่งย้อนหลัง")
      const q = Object.assign({}, body, { queuedAt: todayStr() + ' ' + nowTime() });
      if (obAdd('checkIn', { checkin: q }, `เช็คอิน · ${p.name} · ${PLACE[CF.location].label} · ${nowTime()} น.`)) {
        clearDraft('ci');
        CF = { init: 1, patientId: '', location: '', photo: '', done: { patientName: p.name, patientId: p.id, location: CF.location, zone: p.zone, time: nowTime(), queued: true } };
        render(); toast('ไม่มีสัญญาณ — เก็บเช็คอินไว้ในเครื่องแล้ว จะส่งให้อัตโนมัติ');
      }
    } else toast(e.message, 'err');
  }
}


/* ==========================================================================
   ตัวจัดการการกด/พิมพ์ทั้งหมด (event delegation) + เริ่มระบบ
   ========================================================================== */
const objs = () => ({ F, SF, PF, TF, S, CF });
function renderKeep() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function onChip(obj, name) {
  if (obj === 'S' && name === 'scope') { const el = $('#plist'); if (el) el.innerHTML = patientListHTML(); }
  if (obj === 'SF') paintSell();
  if (obj === 'CF') renderKeep();
  if (obj === 'PF') {
    if (name === 'type' && !PF.id) PF.defaultLocation = DEFAULT_LOC[PF.type];
    if (name === 'type' || name === 'defaultLocation') { if (PF.defaultLocation === 'HOME' && !PF.zone) PF.zone = 'A'; renderKeep(); }
  }
}
function showLoginMsg(t) { const el = $('#loginMsg'); if (el) { el.textContent = t; el.classList.remove('hidden'); } }

const actions = {
  back: () => back(),
  home: () => goHome('patients'),
  landing: () => goLanding(),
  enter: (d) => chooseMode(d.v),
  'ci-camera': () => { const i = $('#ciPhoto'); if (i) i.click(); },
  'save-checkin': () => saveCheckin(),
  'view-photo': (d) => viewPhoto(d.id),
  tab: (d) => { S.tab = d.v; render(); },
  logout: () => doLogout(),
  'close-sheet': () => closeSheet(),
  async login(d) {
    const code = ($('#loginCode').value || '').trim();
    if (!code) { showLoginMsg('กรอกรหัสก่อน'); return; }
    try { await run(() => doLogin(code, $('#loginRemember').checked, (d && d.mode) || 'staff'), { quiet: true }); }
    catch (e) { showLoginMsg(e.message); }
  },
  chip: (d, el) => {
    const g = el.parentElement, o = objs()[g.dataset.obj], name = g.dataset.name, v = d.v;
    if (g.dataset.multi === '1') {
      const arr = o[name], i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      el.classList.toggle('on');
    } else {
      o[name] = (o[name] === v && !g.dataset.req) ? '' : v;
      $$('.chip', g).forEach(c => c.classList.toggle('on', c.dataset.v === o[name]));
    }
    onChip(g.dataset.obj, name);
  },
  patient: (d) => go('patient', { id: d.id }),
  record: (d) => { initForm(pkgById(d.k)); if (d.loc && !F.restored) F.location = d.loc; go('record', { patientId: d.p, pkgId: d.k }); },
  'draft-reset': (d) => { clearDraft(d.k); initForm(pkgById(d.k), true); renderKeep(); },
  'ci-reset': () => { clearDraft('ci'); CF = {}; render(); },
  'edit-session': (d) => {
    let s = null;
    for (const key of Object.keys(S.cache)) { const f = (S.cache[key] || []).find(x => x.id === d.id); if (f) { s = f; break; } }
    if (!s || !pkgById(s.pkgId)) return;
    closeSheet(); initEdit(s); go('record', { patientId: s.patientId, pkgId: s.pkgId, edit: s.id });
  },
  'copy-line': () => doCopy(lineMessage(R.k, R.p, R.ss, R.sid, R.mode)),
  'copy-renew': () => doCopy(renewMessage(R.k, R.p)),
  'copy-msg': (d) => copyMsg(d.k, d.kind),
  'share-link': (d) => openShareLink(d.k),
  'link-copy': async (d) => { toast((await copyText(famUrl(pkgById(d.k).shareToken))) ? 'คัดลอกลิงก์แล้ว' : 'คัดลอกไม่ได้ — กดค้างที่ลิงก์เพื่อคัดลอกเอง', 'err'); },
  'link-share': async (d) => {
    const k = pkgById(d.k), url = famUrl(k.shareToken);
    try { if (navigator.share) await navigator.share({ title: 'บัตรสะสมครั้งการบำบัด ' + k.patientName, text: 'ดูจำนวนครั้งที่เหลือและบันทึกการฝึกได้ที่ลิงก์นี้', url }); else { await copyText(url); toast('คัดลอกลิงก์แล้ว'); } }
    catch (e) { /* ยกเลิกการแชร์ */ }
  },
  'link-off': (d) => linkOff(d.k),
  'ob-open': () => openOutbox(),
  'ob-del': (d) => { if (confirm('ลบรายการนี้ทิ้ง? (จะไม่ถูกบันทึกเข้าระบบ)')) { obDrop(d.id); openOutbox(); if (cur.name === 'home' || cur.name === 'landing') renderKeep(); } },
  'ob-retry': (d) => { obSave(obAll().map(x => x.id === d.id ? Object.assign(x, { err: '' }) : x)); closeSheet(); obFlush(false); },
  'ob-flush': () => { closeSheet(); obFlush(false); },
  'copy-url': async () => { toast((await copyText(location.href.split('#')[0])) ? 'คัดลอกลิงก์แล้ว — วางในช่องที่อยู่ของ Safari/Chrome' : 'คัดลอกไม่ได้', 'err'); },
  'tip-close': () => { try { localStorage.setItem('cmcc_tip', '1'); } catch (e) { /* ignore */ } renderKeep(); },
  install: async () => { if (S.installEv) { S.installEv.prompt(); try { await S.installEv.userChoice; } catch (e) { /* ignore */ } S.installEv = null; renderKeep(); } },
  slip: (d) => openSlip(d.code),
  'slip-share': () => slipShare(false),
  'slip-save': () => slipShare(true),
  'close-month': (d) => toggleMonth(true, Number(d.n), Number(d.s)),
  'open-month': () => toggleMonth(false),
  'copy-last': (d) => copyLast(d.id),
  pain: (d, el) => { F.pain = String(F.pain) === d.v ? '' : d.v; $$('#painRow button').forEach(b => b.classList.toggle('on', String(F.pain) === b.dataset.v)); },
  appt: (d) => { F.nextAppt = addDays(F.date || todayStr(), Number(d.n)); const i = $('#nextAppt'); if (i) i.value = F.nextAppt; },
  'save-session': () => saveSession(),
  report: (d) => { closeSheet(); go('report', { pkgId: d.k, sessionId: d.s || '' }); },
  'rep-mode': (d) => setReportMode(d.v),
  share: () => shareReport(),
  'save-img': () => saveReportImage(),
  print: () => window.print(),
  session: (d) => openSession(d.id),
  void: (d) => voidSession(d.id),
  excel: () => exportExcel(),
  'new-patient': () => { PF = {}; go('patientForm', {}); },
  'edit-patient': (d) => { PF = {}; go('patientForm', { id: d.id }); },
  'save-patient': () => savePatient(),
  'toggle-patient': (d) => togglePatient(d.id),
  sell: (d) => { initSell(patientById(d.p)); go('sell', { patientId: d.p }); },
  'pick-pack': (d) => { SF.packKey = d.v; paintSell(); },
  ovr: (d, el) => { SF.override = el.checked; $('#sell-price').classList.toggle('hidden', !SF.override); if (SF.override) $('#sell-price').focus(); paintSell(); },
  'save-sell': () => saveSell(),
  'edit-pkg': (d) => openPkgEdit(d.k),
  'save-pkg': (d) => savePkg(d.k),
  'cancel-pkg': (d) => cancelPkg(d.k),
  'new-staff': () => { TF = {}; go('staffForm', {}); },
  'edit-staff': (d) => { TF = {}; go('staffForm', { code: d.code }); },
  'save-staff': () => saveStaff(),
  'toggle-staff': (d) => toggleStaff(d.code)
};
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) { const r = fn(el.dataset, el); if (r && r.catch) r.catch(() => { }); }
});
function bindInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.bind) {
    const [o, k] = el.dataset.bind.split('.');
    objs()[o][k] = el.value;
    if (el.dataset.bind === 'SF.price') paintSell();
    if (el.dataset.bind === 'CF.patientId' && e.type === 'change') {
      const p = patientById(CF.patientId);
      if (p && !CF.location) CF.location = p.defaultLocation || '';
      renderKeep();
    }
    return true;
  }
  return false;
}
document.addEventListener('input', e => {
  if (bindInput(e)) return;
  if (e.target.id === 'pq') { S.q = e.target.value; const el = $('#plist'); if (el) el.innerHTML = patientListHTML(); }
  if (e.target.id === 'sq') { S.sq = e.target.value; paintSessions(); }
});
document.addEventListener('change', e => {
  if (bindInput(e)) return;
  const id = e.target.id;
  if (id === 'smonth' && e.target.value) { S.month = e.target.value; paintSessions(); }
  if (id === 'dmonth' && e.target.value) { S.month = e.target.value; paintDash(); }
  if (id === 'sstaff') { S.staffFilter = e.target.value; paintSessions(); }
  if (id === 'cmonth' && e.target.value) { S.month = e.target.value; paintCheckins(); }
  if (id === 'cstaff') { S.ciStaff = e.target.value; paintCheckins(); }
  if (id === 'ciPhoto') handleCiPhoto(e.target.files && e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'loginCode') actions.login({ mode: e.target.dataset.mode });
});

async function boot() {
  setupPWA();
  const fam = new URLSearchParams(location.search).get('f');
  if (fam) { cur = { name: 'family', params: { token: fam } }; render(); return; }   // หน้าสำหรับญาติ: ไม่ล็อกอิน ไม่โหลดข้อมูลทีมงาน
  cur = { name: 'landing', params: {} };
  render();
  let saved = '';
  try { saved = localStorage.getItem('cmcc_code') || ''; } catch (e) { /* ไม่มี storage */ }
  if (GAS_API_URL.indexOf('PASTE_') === 0) { toast('ยังไม่ได้ตั้งค่า GAS_API_URL ในไฟล์ index.html', 'err'); return; }
  if (saved) {
    // เข้าระบบเงียบๆ ด้วยรหัสที่จำไว้ แล้วอยู่ที่หน้าแรกให้เลือกโหมด
    try { await run(() => doLogin(saved, true, 'staff', { stay: true }), { quiet: true }); }
    catch (e) {
      if (e.network) { toast('ยังไม่มีสัญญาณอินเทอร์เน็ต — ลองเปิดใหม่เมื่อมีสัญญาณ', 'err'); return; }   // รหัสยังจำไว้ ไม่ลบ
      try { localStorage.removeItem('cmcc_code'); } catch (x) { /* ignore */ } S.me = null; goLanding(); toast('เข้าอัตโนมัติไม่สำเร็จ: ' + e.message, 'err');
    }
  }
}
boot();
